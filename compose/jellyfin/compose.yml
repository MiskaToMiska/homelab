services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - "${APPDATA_DIR}/jellyfin/config:/config"
      - "${APPDATA_DIR}/jellyfin/cache:/cache"
      - "${MEDIA_DIR}/:/media:ro"
    devices:
      - /dev/dri:/dev/dri
    restart: 'unless-stopped'
