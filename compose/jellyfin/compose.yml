services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    ports:
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - /appdata/jellyfin/config:/config
      - /appdata/jellyfin/cache:/cache
      - /srv/media/:/media:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - proxy_net
    restart: 'unless-stopped'

networks:
  proxy_net:
    external: true